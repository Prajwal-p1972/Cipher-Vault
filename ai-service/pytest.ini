[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    ocr: tests that require EasyOCR models and OCR pipeline execution
    slow: tests that take substantial execution time or initialize heavyweight models
    llm_live: tests that require a running local Ollama instance with the configured model
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
